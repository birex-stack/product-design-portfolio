<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-7VHSD6ZKSP"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-7VHSD6ZKSP');</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cases — XFTM SOC Prototype</title>
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./soc-proto.css" />
  </head>
  <body>
    <div class="soc-proto-banner">
      <a href="../ibm-xftm.html">← Back to IBM XFTM case study</a>
      <span
        ><strong>Interactive prototype</strong> — SOC analyst investigation
        experience</span
      >
    </div>

    <div class="soc-app">
      <header class="soc-header">
        <div class="soc-header-left">
          <div class="soc-breadcrumb">
            <a href="./shift-briefing.html">IBM XFTM</a><span>/</span
            ><span aria-current="page">Cases</span>
          </div>
        </div>
        <div class="soc-header-right">
          <button class="soc-header-action" type="button" aria-label="3 notifications">
            <svg width="20" height="20" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
              <path
                d="M28.7 20.3 26 17.6V13a10 10 0 0 0-9-9.95V1h-2v2.05A10 10 0 0 0 6 13v4.6l-2.7 2.7a.91.91 0 0 0-.3.7v3a.94.94 0 0 0 1 1h7.1a5 5 0 0 0 9.8 0H28a.94.94 0 0 0 1-1v-3a.91.91 0 0 0-.3-.7ZM16 28a3 3 0 0 1-2.8-2h5.6A3 3 0 0 1 16 28Zm11-5H5v-1.6l2.7-2.7A.91.91 0 0 0 8 18v-5a8 8 0 0 1 16 0v5a.91.91 0 0 0 .3.7l2.7 2.7Z"
              />
            </svg>
            <span class="soc-bell-badge">3</span>
          </button>
          <button class="soc-header-action" type="button" aria-label="User profile">
            <span class="soc-avatar" aria-hidden="true">A</span>
          </button>
        </div>
      </header>

      <aside class="soc-sidebar" aria-label="Primary">
        <nav class="soc-nav">
          <a href="./shift-briefing.html">Briefing</a>
          <a href="./alerts.html"
            >Alerts <span class="soc-nav-badge">156</span></a
          >
          <a class="is-active" href="./cases.html">Cases</a>
          <a href="#">Threat intel</a>
          <a href="#">Reports</a>
          <a href="#">Dashboards</a>
        </nav>
        <div class="soc-nav-footer">
          <a href="./passdown.html">End of shift</a>
          <a href="../ibm-xftm.html">Exit prototype</a>
        </div>
      </aside>

      <main class="soc-main">
        <div class="soc-page-head">
          <div>
            <h1>Cases</h1>
            <p>
              Open investigations · correlated alerts · ATDS recommendations
            </p>
          </div>
          <a class="soc-btn soc-btn--secondary" href="./passdown.html"
            >End of shift</a
          >
        </div>

        <div class="soc-toolbar">
          <div
            class="soc-switcher"
            role="tablist"
            aria-label="Case assignment filter"
          >
            <button
              type="button"
              class="is-active"
              role="tab"
              aria-selected="true"
              data-filter="mine"
            >
              Assigned to me
            </button>
            <button
              type="button"
              role="tab"
              aria-selected="false"
              data-filter="all"
            >
              All
            </button>
          </div>
          <div class="soc-toolbar-tools">
            <label class="soc-search" aria-label="Search cases">
              <svg
                class="soc-search__icon"
                width="16"
                height="16"
                viewBox="0 0 32 32"
                fill="currentColor"
                aria-hidden="true"
              >
                <path
                  d="m30 28.59-8.46-8.46a11 11 0 1 0-1.41 1.41L28.59 30ZM5 14a9 9 0 1 1 9 9 9 9 0 0 1-9-9Z"
                />
              </svg>
              <input type="search" placeholder="Search cases" />
            </label>
            <button
              class="soc-icon-btn"
              type="button"
              aria-label="Filter cases"
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 32 32"
                fill="currentColor"
                aria-hidden="true"
              >
                <path
                  d="M18 28h-4a2 2 0 0 1-2-2v-7.59L4.59 11A2 2 0 0 1 4 9.59V6a2 2 0 0 1 2-2h20a2 2 0 0 1 2 2v3.59a2 2 0 0 1-.59 1.41L20 18.41V26a2 2 0 0 1-2 2zM6 6v3.59l8 8V26h4v-8.41l8-8V6z"
                />
              </svg>
            </button>
          </div>
        </div>

        <div id="cases-root"></div>
      </main>
    </div>

    <script type="module" src="./soc-ip-flyout.js"></script>
    <script src="./soc-demo-data.js"></script>
    <script src="./soc-cases-page.js"></script>
  </body>
</html>
